[project]
name = "bricksmith-mlops"
version = "0.0.0"
description = "Model development flow for bricksmith projects: samples, slices, exclusions, the model chain and MLflow on Unity Catalog."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Israel Holetz", email = "holetz@gmail.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = [
  "bricksmith",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# PEP 420 namespace: src/bricksmith has no __init__.py, so every distribution adds its own
# subpackage under the shared ``bricksmith`` namespace.
[tool.hatch.build.targets.wheel]
packages = ["src/bricksmith"]

[tool.uv.sources]
bricksmith = { workspace = true }
