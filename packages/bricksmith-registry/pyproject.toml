[project]
name = "bricksmith-registry"
version = "0.0.0"
description = "Column registry and naming grammar checks for data projects. Pure Python, no Spark."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Israel Holetz", email = "holetz@gmail.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# PEP 420 namespace: src/bricksmith has no __init__.py, so every distribution adds its own
# subpackage under the shared ``bricksmith`` namespace.
[tool.hatch.build.targets.wheel]
packages = ["src/bricksmith"]
