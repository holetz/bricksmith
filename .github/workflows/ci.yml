name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The JVM feature kernel (decision 0019): the Scala suite runs the shared golden vectors, and the JAR is
  # handed to the checks job, which ships it inside the wheel.
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1.5.16
      - name: Build and test the kernel
        run: python3 scripts/build_kernel.py
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Kernel parity on a classic local Spark session
        run: uv run --isolated --with pyspark==4.0.1 pytest tests/jvm -q -rs --random-order
        env:
          BRICKSMITH_REQUIRE_KERNEL: "true"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kernel-jar
          path: src/bricksmith/features/_jars/bricksmith-kernel.jar
          if-no-files-found: error

  # The tests that need a local SparkSession cannot run in the project environment (Databricks Connect refuses
  # one), so they run here in an isolated classic-pyspark environment and fail when any is skipped.
  local-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Local-pyspark parity tests (a skip fails)
        run: python3 scripts/local_spark_check.py

  checks:
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.2
        with:
          name: kernel-jar
          path: src/bricksmith/features/_jars
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Sync the library
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run pyright
      # Random order proves the tests are independent; the coverage floor is [tool.coverage.report] fail_under.
      - name: Tests (random order, under coverage)
        run: uv run coverage run -m pytest --random-order
      - name: Coverage floor
        run: uv run coverage report --skip-covered
      - name: Build the library
        run: uv build
      - name: Verify wheel and sdist in clean environments (heavy integrations absent, kernel JAR packaged)
        run: python3 scripts/verify_dist.py --dist dist --require-kernel
      # The private denylist never leaves the developer machine; CI runs the generic patterns
      # and gitleaks as a second line behind the local pre-commit and pre-push hooks.
      - name: Leak gate (generic patterns)
        run: python3 scripts/leak_check.py --all --generic-only
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
