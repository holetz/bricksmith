[project]
name = "bricksmith"
version = "0.0.0"
description = "Python framework for Databricks data projects, with registry, MLOps and monitoring capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Israel Holetz", email = "holetz@gmail.com" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
spark = ["databricks-connect"]
sdk = ["databricks-sdk"]
bundle = ["databricks-bundles"]
mlops = ["mlflow", "scikit-learn"]
features = ["databricks-feature-engineering"]
feature-engines = ["numpy", "pyarrow"]
postgres = [
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
bricksmith = "bricksmith.cli.main:main"
bricksmith-run = "bricksmith.runner.entrypoint:run_entrypoint"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The JVM feature kernel is built by scripts/build_kernel.py into an ignored path; ship it when present.
artifacts = ["src/bricksmith/features/_jars/*.jar"]

[tool.hatch.build.targets.wheel]
packages = ["src/bricksmith"]

[dependency-groups]
dev = [
  "coverage>=7.17.5",
  "numpy",
  "pandas",
  "pyarrow",
  "pyright",
  "pytest",
  "pytest-random-order>=1.2.0",
  "ruff",
]
# Heavy integrations for tests/remote; deliberately not a default group (see docs/project/specifications.md).
remote = [
  "databricks-bundles",
  "databricks-connect>=17.3,<20",
  "databricks-sdk",
  "mlflow",
  "scikit-learn",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".agents", ".design/build"]  # generated: the quenching runtime (`cq deploy`) and the design projections (`cq design build`)

[tool.ruff.lint]
select = ["ALL"]
# D203/D213 conflict with D211/D212; COM812 and ISC001 conflict with the formatter.
# CPY001: the license is declared once, in LICENSE.
ignore = ["COM812", "CPY001", "D203", "D213", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["ANN", "D", "INP001", "E501"]  # synthetic task modules mirror what a project writes
"**/tests/**" = ["D", "INP001", "PLR2004", "S101", "S603", "S607"]
"scripts/**" = ["INP001", "S603", "S607", "T201"]
# The storage package renders SQL from validated identifiers and quoted literals by design.
"src/bricksmith/storage/**" = ["S608"]
# Schema evolution renders DDL from validated identifiers and quoted literals by design.
"src/bricksmith/evolution/**" = ["S608"]
"src/bricksmith/quality/**" = ["S608"]
# Stability views render SQL from validated identifiers only.
"src/bricksmith/monitor/stability/tables.py" = ["S608"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests"]
extraPaths = ["src", "scripts"]  # src first (pyright drops its automatic src root once extraPaths is set); scripts for the operations
exclude = ["tests/remote/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
# The repository root resolves the shared fixture library (tests.fixtures); scripts/ makes the operations importable.
pythonpath = [".", "scripts"]
# Temporary directories live under the system temp root and are removed when the run ends.
tmp_path_retention_policy = "none"
markers = [
  "unit: in-process behavior; may reach temporary files, subprocesses and local sessions",
  "contract: repository-facing contracts (packaging, leak gate, configuration, plugin bundle)",
  "jvm: the JVM feature kernel on a classic local Spark session",
  "remote: behavior on a real Databricks workspace (opt-in)",
  "databricks: needs a Databricks workspace (Free Edition in CI)",
  "slow: builds and installs the package into clean environments",
  "docker: needs a local Docker daemon (disposable containers); skipped when unavailable",
]

[tool.coverage.run]
source = ["src", "scripts"]
# Measured roots and the floor are the proof front's (`.agents/quenching.json` proof.measuredRoots, .coverage-floor.json).

[tool.coverage.report]
fail_under = 86

