[project]
name = "bricksmith"
version = "0.0.0"
description = "Python framework for Databricks data projects, with registry, MLOps and monitoring capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Israel Holetz", email = "holetz@gmail.com" }]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
spark = ["databricks-connect"]
sdk = ["databricks-sdk"]
bundle = ["databricks-bundles"]
mlops = ["mlflow", "scikit-learn"]

[project.scripts]
bricksmith = "bricksmith.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bricksmith"]

[dependency-groups]
dev = [
  "pyright",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
# D203/D213 conflict with D211/D212; COM812 and ISC001 conflict with the formatter.
# CPY001: the license is declared once, in LICENSE.
ignore = ["COM812", "CPY001", "D203", "D213", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "INP001", "PLR2004", "S101", "S603", "S607"]
"scripts/**" = ["INP001", "S603", "S607", "T201"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]
markers = ["databricks: needs a Databricks workspace (Free Edition in CI)"]
